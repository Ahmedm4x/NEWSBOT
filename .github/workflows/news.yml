name: Shafaq News Bot

on:
  schedule:
    - cron: "3-58/5 * * * *"  # every 5 minutes, offset from :00 (GitHub may delay it a bit)
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: shafaq-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check for new news
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RUN_ONCE: "1"
          RUN_FOR: "0"   # one quick check per run (cron-job.org starts it every 2 minutes)
        run: python bot.py

      - name: Save what was already sent
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add seen.json state.json
          if ! git diff --cached --quiet; then
            git commit -m "update seen"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 3
            done
          fi
